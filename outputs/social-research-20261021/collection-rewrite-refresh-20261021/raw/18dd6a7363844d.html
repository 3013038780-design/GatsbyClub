<script>
var timeout;
var count = 60; // 倒数十下
var check_flag = 1;
var mobile='';
BtnCount = function() {

       // 启动按钮
       if (count == 0) {
        $("#get_code").removeClass("cur");
       	$("#sec").html('<b style="color:#c2b587" id="get_code_" onclick="get_valid_code_pre();return false;">重新发送</b>');
        //$("#sec_").html(60);
        flag = 1;
        clearTimeout(timeout);
    }
    else {
        count--;
        $("#sec_").html(count);
        setTimeout(BtnCount, 1000);
    }
};

function get_valid_code_pre(){
	var _val = $.trim($('#phone').val());
	if(_val.length <5){
		// alert("请正确输入手机号码");
		$("#messageBox").html("请正确输入手机号码");
		$("#messapgePage").css("opacity",1);
		$("#messapgePage").show();
		return false;
	}

	$(".pincode").show();
	$(".js-pincode-send-mobile").html(_val);
}

var flag=1;
function get_code_pre(){
	var _val = $.trim($('#phone').val());
	if(_val.length <5){
		// alert("请正确输入手机号码");
		$("#messageBox").html("请正确输入手机号码");
		$("#messapgePage").css("opacity",1);
		$("#messapgePage").show();
		return false;
	}

	$("#messapgePage1").show();
	$("#messapgePage1").css("opacity",1);
	$("#send_mobile").html(_val);
}
function get_code(){
	var _val = $.trim($('#phone').val());
	if(_val.length <5){
		// alert("请正确输入手机号码");
		$("#messageBox").html("请正确输入手机号码");
		return false;
	}

	$("#has_mobile").show();
	$("#in_mobile").hide();
	$("#_mobile").html(_val);
	$("#sec").html('<font id="sec_">60秒</font>秒重新发送');
	if(flag == 1){
		flag = 2;
		count = 60;
		timeout = setTimeout(BtnCount, 1000);
		$("#get_code").addClass("cur");
		$("#check").removeClass("cur");
		$("#sec").css("display","block");
		$('#check').bind('click', function() {
			 check();
			});
		$.ajax({
			url:'/aj/insertmem/getvcode',
			data:{
				'mobile':_val
			},
			dataType:'json',
			type:'post',
			success:function (res) {
				if(res.code == 100000){
				// $(".tip-pop").show();
				//alert("您的资料已经递交，我们会在2个工作日内将审核结果发送至您的邮箱，请耐心等候！");
					mobile=_val;
				}else{
					// alert(res.msg);
					$("#messageBox").html(res.msg);
					$("#messapgePage").css("opacity",1);
					$("#messapgePage").show();
					flag = 1;
					count = 60;
					$("#sec").html('<font id="sec_">60秒</font>秒重新发送');
					clearTimeout(timeout);
					$("#get_code").removeClass("cur");
				}
			}
		});
	}



}

$(function(){
	$('.js-pincode').attr('src', 'http://www.imlady.cn/pincode?' + new Date().getTime());
	$('.js-pincode').on('click', function(){
		$('.js-pincode').attr('src', 'http://www.imlady.cn/pincode?' + new Date().getTime());
	});
	$('.js-pincode-cancel-btn').on('click', function(){
		$('.pincode').hide();
	});
	$('.js-pincode-send-btn').on('click', function(){
		var pincode = $('.js-pincode-input').val();
		if (!pincode) {
			alert('请输入验证码');
			return;
		}
		var _val = $.trim($('#phone').val());
		if(flag == 1){
			flag = 2;
			$.ajax({
				url:'/aj/insertmem/getvcode',
				data:{
					'mobile':_val,
					'pcode':pincode
				},
				dataType:'json',
				type:'post',
				complete:function(XMLHttpRequest, textStatus) {
					$('.js-pincode-input').val('');
					$('.pincode').hide();
					$('.js-pincode').attr('src', 'http://www.imlady.cn/pincode?' + new Date().getTime());
				},
				success:function (res) {
					if(res.code == 100000){
					// $(".tip-pop").show();
					//alert("您的资料已经递交，我们会在2个工作日内将审核结果发送至您的邮箱，请耐心等候！");
						$("#has_mobile").show();
						$("#in_mobile").hide();
						$("#_mobile").html(_val);
						$("#sec").html('<font id="sec_">60秒</font>秒重新发送');
						mobile=_val;
						count = 60;
						timeout = setTimeout(BtnCount, 1000);
						$("#get_code").addClass("cur");
						$("#check").removeClass("cur");
						$("#sec").css("display","block");
						$('#check').bind('click', function() {
							 check();
							});
					}else{
						// alert(res.msg);
						$("#messageBox").html(res.msg);
						$("#messapgePage").css("opacity",1);
						$("#messapgePage").show();
						flag = 1;
						count = 60;
						$("#sec").html('<font id="sec_">60秒</font>秒重新发送');
						clearTimeout(timeout);
						$("#get_code").removeClass("cur");
					}
				}
			});
		}
	});
});

$("#closebtn").click(function(){
	$('.pincode').hide();
			  $("#messapgePage").css("opacity",1);
			  $("#messapgePage").hide();
			});
$("#close").click(function(){
	$('.pincode').hide();
			  $("#messapgePage1").css("opacity",1);
			  $("#messapgePage1").hide();
			  get_code();
			});
$("#cannel").click(function(){
	$('.pincode').hide();
			  $("#messapgePage1").css("opacity",1);
			  $("#messapgePage1").hide();
			});
function check(){
	var _val = $.trim($('#number').val());
	if(_val == ''||_val.length !=4){
		// alert('请填写正确验证码');
		$("#messageBox").html("请填写正确验证码");
		$("#messapgePage").css("opacity",1);
		$("#messapgePage").show();
		return;
	}

	if(check_flag == 1){
		check_flag = 2;
	$.ajax({
		url:'/aj/insertmem/check',
		data:{
			'mobile':$.trim($('#phone').val()),
			'code':_val
		},
		dataType:'json',
		type:'post',
		success:function (res) {
			if(res.code == 100000){

				window.location.href="/html/join-0929/from.html?mobile="+res.data;
			}else{
				// alert(res.msg);
				$("#messageBox").html(res.msg);
				$("#messapgePage").css("opacity",1);
				$("#messapgePage").show();
				check_flag = 1;
			}
		}
	});
	}
}
</script>
