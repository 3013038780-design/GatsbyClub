<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">GatsbyClub 项目工作台</title><desc id="desc">以交友和共同体验为主的线下会员社群。先读项目共识，再看调研证据，再做产品与运营。商业、婚恋、旅行是三类需求。</desc><rect width="1200" height="350" rx="18" fill="#f3f0e8"/><path d="M0 8h1200" stroke="#233d34" stroke-width="16"/><text x="56" y="65" fill="#a45b3d" font-size="15" letter-spacing="4" font-family="Arial,sans-serif">GATSBYCLUB / PROJECT DESK</text><text x="53" y="130" fill="#233d34" font-size="43" font-weight="600" font-family="PingFang SC,Microsoft YaHei,sans-serif">把合适的人，持续聚在一起。</text><text x="56" y="174" fill="#5d6c61" font-size="18" font-family="PingFang SC,Microsoft YaHei,sans-serif">商业交流 · 婚恋交友 · 旅行与共同体验</text><path d="M56 205h1088" stroke="#c8cdbc"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="56" y="249" fill="#a45b3d" font-size="16">01 项目共识</text><text x="56" y="284" fill="#233d34" font-size="20">先确认我们做什么</text><text x="444" y="249" fill="#a45b3d" font-size="16">02 调研证据</text><text x="444" y="284" fill="#233d34" font-size="20">再看客户与同行怎么做</text><text x="837" y="249" fill="#a45b3d" font-size="16">03 产品与运营</text><text x="837" y="284" fill="#233d34" font-size="20">把权益、活动和成本做实</text></g><path d="M380 266h34m-9-8 9 8-9 8M774 266h34m-9-8 9 8-9 8" stroke="#a45b3d" stroke-width="2" fill="none"/></svg>
